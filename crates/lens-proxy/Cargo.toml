[package]
name = "lens-proxy"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
http = "1"
lens-core = { path = "../lens-core" }
tokio = { version = "1.48", features = ["io-util", "net", "rt", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros"] }

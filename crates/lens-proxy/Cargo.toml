[package]
name = "lens-proxy"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
http = "1"
lens-core = { path = "../lens-core" }
lens-tls = { path = "../lens-tls" }
tokio = { version = "1.48", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

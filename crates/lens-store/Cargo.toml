[package]
name = "lens-store"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
lens-core = { path = "../lens-core" }
lens-proto-http1 = { path = "../lens-proto-http1" }
lens-proto-http2 = { path = "../lens-proto-http2" }
lens-proto-postgres = { path = "../lens-proto-postgres" }
lens-proto-redis = { path = "../lens-proto-redis" }
lens-protocol = { path = "../lens-protocol" }
lens-redact = { path = "../lens-redact" }
tokio = { version = "1.48", features = ["sync"] }

[dev-dependencies]
httlib-hpack = "0.1"
tokio = { version = "1.48", features = ["macros", "rt"] }

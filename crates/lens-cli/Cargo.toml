[package]
name = "lens-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[[bin]]
name = "lens"
path = "src/main.rs"

[dependencies]
lens-core = { path = "../lens-core" }
lens-proxy = { path = "../lens-proxy" }
lens-store = { path = "../lens-store" }
tokio = { version = "1.48", features = ["rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

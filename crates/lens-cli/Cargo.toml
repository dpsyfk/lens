[package]
name = "lens-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[[bin]]
name = "lens"
path = "src/main.rs"

[features]
default = []
ebpf = ["lens-ebpf/runtime"]

[dependencies]
lens-core = { path = "../lens-core" }
lens-ebpf = { path = "../lens-ebpf" }
lens-platform = { path = "../lens-platform" }
lens-plugin = { path = "../lens-plugin" }
lens-proxy = { path = "../lens-proxy" }
lens-replay = { path = "../lens-replay" }
lens-store = { path = "../lens-store" }
lens-tls = { path = "../lens-tls" }
lens-tui = { path = "../lens-tui" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tempfile = "3"

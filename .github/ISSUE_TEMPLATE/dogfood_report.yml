name: v1 dogfood report
description: Record a cross-platform release-candidate verification result.
title: "[Dogfood]: "
body:
  - type: markdown
    attributes:
      value: Complete this report using a binary downloaded from the draft release. Copy `DOGFOOD-REPORT.example.json`, fill the same evidence, and attach it for the automated release gate. Do not attach secret or reveal-mode exports.
  - type: input
    id: release
    attributes:
      label: Release tag and artifact
      placeholder: v0.1.0 / lens-0.1.0-x86_64-unknown-linux-gnu.tar.gz
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, CPU architecture, terminal, and shell.
    validations:
      required: true
  - type: input
    id: tester
    attributes:
      label: Independent tester
      description: One person may submit only one release-target report.
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Release gates
      options:
        - label: "[artifact_verification] Artifact checksum, Sigstore bundle, and GitHub provenance verification passed."
          required: true
        - label: "[first_run] First-run commands completed without unexplained failures."
          required: true
        - label: "[tui_restoration] TUI quit and Ctrl-C restored the terminal."
          required: true
        - label: "[http] HTTP forwarding, inspection, latency, and redaction passed."
          required: true
        - label: "[https] HTTPS trust, interception, pinned-client passthrough, and trust removal passed."
          required: true
        - label: "[postgres] PostgreSQL forwarding, inspection, timing, and redaction passed."
          required: true
        - label: "[redis] Redis forwarding, pipelining, timing, and structural redaction passed."
          required: true
        - label: "[http2_grpc] HTTP/2 multiplexing and gRPC metadata inspection passed."
          required: true
        - label: "[plugins] Plugin opt-in, sandbox containment, integrity, limits, and always-redacted input passed."
          required: true
        - label: "[default_redaction] TUI and export retained no test secrets."
          required: true
        - label: "[fault_overload] Malformed and saturated observation remained flow-local and did not block forwarding."
          required: true
        - label: "[upgrade_rollback] Upgrade preserved config/trust compatibility and rollback restored the prior binary."
          required: true
        - label: "[native_signature] Windows Authenticode or macOS Developer ID signature and notarization passed (required on Windows/macOS)."
        - label: "[ebpf] Scoped Linux eBPF identity, Lens exclusion, metadata-only behavior, and detach-on-exit passed (required on Linux)."
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and observations
      description: Link redacted logs, diagnostics, and blocking issues. Never attach reveal-mode exports.
    validations:
      required: true

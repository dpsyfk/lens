name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile release helpers
        run: python -m py_compile scripts/*.py
      - name: Test fail-closed release evidence gate
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Validate source release readiness
        run: python scripts/release_gate.py
      - name: Check release smoke harness help
        run: python scripts/release-smoke.py --help
      - name: Check workspace release version
        run: python scripts/check-versions.py
      - name: Prove deterministic archives and expected contents
        shell: bash
        run: |
          mkdir -p target/package-test
          printf '#!/bin/sh\necho lens\n' > target/package-test/lens
          chmod +x target/package-test/lens
          export SOURCE_DATE_EPOCH=1704067200
          python scripts/package-release.py --binary target/package-test/lens --target test-target --version 0.1.0 --format tar.gz --output target/package-a
          python scripts/package-release.py --binary target/package-test/lens --target test-target --version 0.1.0 --format tar.gz --output target/package-b
          cmp target/package-a/*.tar.gz target/package-b/*.tar.gz
          python scripts/verify-release.py target/package-a/*.tar.gz

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test one-line installer behavior
        shell: pwsh
        run: ./scripts/test-install.ps1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --all-features
